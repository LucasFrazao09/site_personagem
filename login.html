<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body id="login-corpo">
    <header>


        <nav>




        </nav>


    </header>



    <main>
        <main class="min-vh-100 d-flex justify-content-center align-items-center">
            <div class="dropdown-menu show">
                <form id="form-login" class="px-4 py-3">
                    <h2 id="titulo" class="text-center mb-3">Login</h2>

                    <div id="c-email" class="mb-3 conjunto">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" placeholder="Email" required>
                    </div>

                    <div id="c-senha" class="mb-3 conjunto">
                        <label for="senha" class="form-label">Senha:</label>
                        <input type="password" class="form-control" id="senha" placeholder="Senha" required>
                    </div>

                    <button id="botao-envio" type="submit" class="btn btn-primary w-100">
                        Entrar
                    </button>
                </form>

                <div id="mensagem"></div>

                <div class="dropdown-divider"></div>

                <a class="dropdown-item toggle text-center" id="toggle" href="#">
                    Não tem conta? Cadastre-se!
                </a>
            </div>
        </main>


    </main>

    <footer>

    </footer>


    <script src="scripts/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
